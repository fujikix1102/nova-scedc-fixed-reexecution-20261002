name: Polarization picker tests

on:
  push:
    paths:
      - "third_party_reexecution/polarization_picker_v1.py"
      - "tests/test_polarization_picker_v1.py"
      - ".github/workflows/polarization-picker-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Run exploratory picker tests
        run: python -m pytest -q tests/test_polarization_picker_v1.py
